name: Manager PRE automatic deployment

on:
  push:
    branches: [pre]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-pre-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref == 'refs/heads/pre'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Preview
      url: https://pre.manager.playctp.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Require PRE deployment configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MANAGER_VPS_PRE_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.MANAGER_VPS_KNOWN_HOSTS }}
        run: |
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo '::error::Missing secret MANAGER_VPS_PRE_SSH_KEY.'; exit 1; }
          [[ -n "$VPS_KNOWN_HOSTS" ]] || { echo '::error::Missing variable MANAGER_VPS_KNOWN_HOSTS.'; exit 1; }
      - uses: ./.github/actions/manager-checks
      - name: Install only the production dependencies from the lockfile
        run: |
          set -euo pipefail
          mkdir -p output/runtime
          cp package.json package-lock.json output/runtime/
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix output/runtime
      - name: Package the verified PRE release
        run: node scripts/package-vps.mjs --out output/ctp-manager.tar.gz --deps output/runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manager-pre-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ctp-manager.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Publish to the PRE VPS and verify the running service
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MANAGER_VPS_PRE_SSH_KEY }}
          VPS_HOST: ${{ vars.MANAGER_VPS_HOST || '31.70.157.157' }}
          VPS_KNOWN_HOSTS: ${{ vars.MANAGER_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo '::error::Invalid VPS host.'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/manager-pre-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id" "$ssh_dir/known_hosts"
          digest="$(sha256sum output/ctp-manager.tar.gz | cut -d ' ' -f 1)"
          status=0
          ssh -T -p 22 -i "$ssh_dir/id" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            -o LogLevel=ERROR "ctp-manager-deploy-pre@$VPS_HOST" \
            "deploy pre $GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $digest" \
            < output/ctp-manager.tar.gz > "$RUNNER_TEMP/receipt.json" 2> "$RUNNER_TEMP/failure.txt" || status=$?
          # Receipts hold reason codes, release names and hashes only.
          cat "$RUNNER_TEMP/receipt.json" "$RUNNER_TEMP/failure.txt"
          {
            if [[ "$status" -eq 0 ]]; then
              printf 'Manager PRE deployed: https://pre.manager.playctp.com\n\n'
            else
              printf 'Manager PRE was **not** deployed (exit %s).\n\n' "$status"
            fi
            printf 'Commit: `%s`\n\nArtifact SHA-256: `%s`\n\n```json\n' "$GITHUB_SHA" "$digest"
            cat "$RUNNER_TEMP/receipt.json" "$RUNNER_TEMP/failure.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
